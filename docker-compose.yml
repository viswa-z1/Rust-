services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paperlens
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    depends_on:
      - postgres
      - mailhog
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres/paperlens
      JWT_SECRET: paperlens-secret
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@paperlens.local
      SMS_GATEWAY_DOMAIN: ""
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/usr/src/backend:ro

volumes:
  postgres_data:
